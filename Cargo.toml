[package]
name = "bsv-middleware-rs"
version = "0.3.0"
edition = "2021"
authors = ["John Calhoun <dev@calhounjohn.com>"]
description = "Framework-agnostic BRC-31 authentication and BRC-29 payment middleware for BSV"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Calhooon/bsv-middleware-rs"
homepage = "https://github.com/Calhooon/bsv-middleware-rs"
keywords = ["bitcoin", "bsv", "authentication", "middleware", "micropayments"]
categories = ["authentication", "cryptography", "web-programming"]
# The workflows and the repository process files are not part of the crate
# (no CLAUDE.md exists today; the entry keeps a later one out).
exclude = ["/.github/", "/RELEASING.md", "/CLAUDE.md"]

[dependencies]
# BSV SDK - provides auth protocol, wallet, key derivation, and the streaming
# BEEF reader the payment door reads through (0.4.0: `verify_stream`).
bsv-rs = { version = "0.4.0", features = ["auth", "wallet", "transaction"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Encoding
hex = "0.4"
base64 = "0.22"

# Random bytes for nonce generation
getrandom = "0.4"

# Async traits
async-trait = "0.1"

# The Axum adapter (`axum_layer`), behind the `axum` feature. `json` is named
# because the layer answers with `axum::Json`; the dev-dependency below turns
# the default features on and would hide its absence from the tests.
axum = { version = "0.8", optional = true, default-features = false, features = ["json"] }

[features]
default = []
# The payment gate and extractor for Axum 0.8 (`bsv_middleware_rs::axum_layer`).
axum = ["dep:axum"]

# Cloudflare Workers (wasm32-unknown-unknown) take randomness from the JS host;
# the Workers call the payment check here, so the crate must build there.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
# A request body that arrives in pieces, for the Axum gate's body transport.
futures = "0.3"
# The peak heap of a reading (tests/payment_flat_memory.rs).
dhat = "0.3"

[[example]]
name = "axum_server"
required-features = ["axum"]
